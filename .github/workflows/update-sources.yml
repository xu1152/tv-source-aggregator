name: Update TV Sources

on:
  schedule:
    # 每天北京时间 6:00 和 18:00 自动更新
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  # 手动触发
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Aggregator
        run: python scripts/aggregate.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json sources.m3u sources.txt tvbox.json
          git diff --staged --quiet || git commit -m "🔄 自动更新直播源 [$(TZ='Asia/Shanghai' date +%Y-%m-%d)]"
          git push
